name: Deploy to Fly.io

# Manual only: a deploy must never run as a side effect of a push or merge.
# test/workflows-deploy-triggers.test.ts enforces this for every workflow that deploys.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Fly.io"
        required: true
        type: boolean
        default: true

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
