# OpenClaw Fly.io deployment configuration
# See https://fly.io/docs/reference/configuration/

app = "shrine-openclaw-chat-staging"
primary_region = "iad" # change to your closest region

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
# Fly uses x86, but keep this for consistency
OPENCLAW_PREFER_PNPM = "1"
OPENCLAW_STATE_DIR = "/data"
NODE_OPTIONS = "--max-old-space-size=1536"

[processes]
# Bootstrap /data/openclaw.json plugins from /app/openclaw.json on every boot
# so the committed source-of-truth config takes effect on the Fly volume.
# See scripts/fly/bootstrap-config.mjs + monorepo#74.
app = "sh -c 'node /app/scripts/fly/bootstrap-config.mjs && exec node dist/index.js gateway --allow-unconfigured --port 3000 --bind lan'"

[http_service]
internal_port = 3000
force_https = true
# Scale to zero and stay there: no machine is kept running, idle machines
# stop, and incoming requests never start one. Running the app is a
# deliberate act (a manual deploy or machine start), not a side effect.
auto_stop_machines = "stop"
auto_start_machines = false
min_machines_running = 0
processes = ["app"]

[[vm]]
size = "shared-cpu-2x"
memory = "2048mb"

[mounts]
source = "openclaw_data"
destination = "/data"
